name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Setup Node.js only to configure the npm registry auth (OIDC trusted publisher exchange).
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Bun is the project's package manager (bun.lock).
      # Pinned to the same stable version the lockfile was generated with — keep in sync with `bun.lock`.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Skip if version already published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view export-codebase@$VERSION version >/dev/null 2>&1; then
            echo "Version $VERSION already published — skipping."
            exit 0
          fi

      # Trusted publisher (OIDC) — no NODE_AUTH_TOKEN needed.
      - name: Publish
        run: npm publish --provenance
